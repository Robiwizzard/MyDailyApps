# Copy into your app's repo as .github/workflows/release.yml.
# On a version tag it builds a single executable per OS/architecture and
# attaches it to a GitHub release. The asset names contain the OS and
# architecture (e.g. cookbook_windows_amd64.zip), which is how the
# MyDailyApps "release" install option picks the right one.
#
# The library entry for the app would then be:
#   { "type": "release", "launch": "cookbook" }
# Set APP below to the same name as the launch command.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  APP: cookbook

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # If the app has a web UI embedded with go:embed, build it first:
      # - uses: actions/setup-node@v4
      #   with: { node-version: 22 }
      # - run: cd ui && npm install && npm run build
      - name: Cross-compile
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            bin=$APP; [ "$os" = windows ] && bin=$APP.exe
            dir="build/${APP}_${os}_${arch}"
            mkdir -p "$dir"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$dir/$bin" .
            (cd "$dir" && zip -qr "../../dist/${APP}_${os}_${arch}.zip" .)
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
