name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build UI
        working-directory: ui
        run: npm install && npm run build
      - run: go vet ./... && go test ./...
      - run: cd kit && go vet ./... && go test ./...
      - name: Windows build compiles
        run: GOOS=windows go build -o /dev/null ./cmd/mydailyapps
